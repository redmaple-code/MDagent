# mdagent-api locations——由 deploy.sh 把下行 include 插进 5443 server 块:
#   include /etc/nginx/mdagent-locations.conf;
# 访问口径:https://<host>:5443/mdagent/v1/... (前缀 /mdagent 在反代处剥掉)

location /mdagent/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
    proxy_http_version 1.1;
    # chat 消息本体小、信封有 192KB 上限;默认继承 server 级 50M 会让
    # 大 body 在校验前全量进 uvicorn 内存,收紧到 2m(红队κ)
    client_max_body_size 2m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
